<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Propostas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#1f5eff;--ink:#0b1330;--mut:#5b6785;--bg:#eef1f8;--line:#e3e8f4}
*{box-sizing:border-box;margin:0}
html{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
body{overflow-x:clip;max-width:100%;touch-action:pan-y pinch-zoom;overscroll-behavior-x:none}
.doc,.editor,.preview,.cwrap,.layout{max-width:100%;min-width:0}
.doc,.f input,.f textarea,.f select,.row,td,.card,.plan{overflow-wrap:anywhere}
img{max-width:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0b1330;color:#fff;flex-wrap:wrap}
.topbar b{margin-right:auto;font-size:15px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;background:#1c2750;color:#fff}
.btn:hover{filter:brightness(1.2)}
.btn.pri{background:var(--a)}
.btn.ghost{background:#eef1f8;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px}
.layout{display:block}
.editor{background:#fff;border-bottom:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:12px;align-items:start}
.editor details{margin-bottom:0}
.preview{padding:24px}
.preview:before{content:"Pré-visualização da proposta";display:block;max-width:880px;margin:0 auto 12px;font-weight:700;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
body.view .preview:before{display:none}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 12px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:12px 0}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details>div{padding-bottom:12px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fafbfe;color:var(--ink)}
.f textarea{resize:vertical}
.row{border:1px dashed #cfd7ea;border-radius:10px;padding:10px;margin-bottom:10px;background:#fafbfe}
.row .top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--mut)}
.row .top label{display:flex;gap:6px;align-items:center;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* documento */
.doc{max-width:880px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(11,19,48,.12)}
.cover{background:radial-gradient(circle at 85% 10%,color-mix(in srgb,var(--a) 70%,transparent),transparent 55%),linear-gradient(160deg,#0b1330,#101c4a);color:#fff;padding:56px;min-height:540px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.brand img{max-height:48px;max-width:200px}
.tag{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.05;font-weight:800;margin:18px 0 14px;letter-spacing:-.02em}
.cover p{opacity:.85;font-size:17px}
.meta{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;opacity:.85}
.meta b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-bottom:2px}
.sec{padding:48px 56px;border-top:1px solid var(--line)}
.sec h2{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.sec h2 em{font-style:normal;color:var(--a)}
.sub{color:var(--mut);margin-bottom:22px;font-size:15px}
.intro{font-size:17px;line-height:1.7;color:#2a3558;white-space:pre-line}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fafbfe}
.card .n{width:34px;height:34px;border-radius:10px;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{color:var(--mut);font-size:14px;line-height:1.55}
.plan{position:relative;border:1.5px solid var(--line);border-radius:18px;padding:24px 20px;background:#fff}
.plan.rec{border-color:var(--a);background:linear-gradient(180deg,color-mix(in srgb,var(--a) 8%,#fff),#fff);box-shadow:0 8px 28px color-mix(in srgb,var(--a) 22%,transparent)}
.badge{position:absolute;top:-12px;left:20px;background:var(--a);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;letter-spacing:.06em;text-transform:uppercase}
.plan h3{font-size:18px}
.price{font-size:32px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
.price small{font-size:13px;color:var(--mut);font-weight:500}
.plan ul{list-style:none;padding:0}
.plan li{padding:6px 0 6px 24px;position:relative;font-size:14px;color:#2a3558}
.plan li:before{content:"✓";position:absolute;left:0;color:var(--a);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:12px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600;white-space:nowrap}
tr.tot td{border:0;font-size:22px;font-weight:800;padding-top:18px}
tr.tot td:last-child{color:var(--a)}
.note{margin-top:14px;font-size:13px;color:var(--mut);background:#f3f5fb;border-radius:10px;padding:12px 14px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:center;padding:12px 0;font-size:16px}
.steps li:before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800}
.terms{list-style:none;padding:0}
.terms li{padding:8px 0 8px 22px;position:relative;font-size:15px;color:#2a3558;line-height:1.5}
.terms li:before{content:"•";position:absolute;left:4px;color:var(--a);font-weight:800}
.cta{background:linear-gradient(160deg,#0b1330,#101c4a);color:#fff;text-align:center;padding:56px}
.cta h2{font-size:30px;margin-bottom:8px}
.cta p{opacity:.8;margin-bottom:22px}
.cta .big{display:inline-block;background:var(--a);color:#fff;text-decoration:none;font-weight:700;padding:15px 30px;border-radius:14px;font-size:16px}
.cta .ct{margin-top:22px;font-size:13px;opacity:.75;line-height:1.8}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.floatbar{display:none}
#login{display:none;min-height:100vh;place-items:center;padding:16px;background:linear-gradient(160deg,#0b1330,#101c4a)}
body.login #login{display:grid}
body.login .topbar,body.login .layout{display:none}
#login form{background:#fff;border-radius:18px;padding:30px;width:100%;max-width:380px}
#login h1{font-size:22px;margin-bottom:4px}#login p{color:var(--mut);font-size:13px;margin-bottom:18px}
#loginMsg{color:#c0262d;font-size:13px;margin-top:10px;min-height:18px}
#login .btn{width:100%;padding:12px}
#modal,#pick,#lib{display:none;position:fixed;inset:0;background:rgba(11,19,48,.6);z-index:50;place-items:center;padding:16px}
#modal.on,#pick.on,#lib.on{display:grid}
#modal .box,#pick .box,#lib .box{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#modal h3,#pick h3,#lib h3{margin-bottom:8px}
#modal textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;margin:10px 0;word-break:break-all}
#modal .warn{font-size:12px;color:#8a5a00;background:#fff4dc;padding:8px 10px;border-radius:8px;margin-bottom:8px}
body.view .topbar,body.view .editor{display:none}
body.view .layout{display:block;height:auto}
body.view .preview{padding:0}
body.view .doc{border-radius:0;box-shadow:none;max-width:920px}
body.view .floatbar{display:flex;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);gap:8px;z-index:30;background:rgba(11,19,48,.92);backdrop-filter:blur(8px);padding:8px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
body.view{padding-bottom:80px}

.cover h1,.cover p,.card h3,.card p,.plan h3,.plan li,.cta h2,.cta p,.terms li,.steps li,.doc td:first-child{white-space:pre-line}
textarea.ag{min-height:36px;overflow:hidden;resize:none;line-height:1.4}
#dim{position:fixed;inset:0;background:rgba(2,5,18,.8);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#dim.on{opacity:1}
.f.focus{position:relative;z-index:45;background:#fff;border-radius:14px;padding:8px;margin:-8px -8px 2px;box-shadow:0 0 0 1.5px #12b8ff,0 0 38px rgba(0,170,255,.6)}
.f.focus span{color:#0077ff;font-weight:700}
.f.focus input,.f.focus textarea,.f.focus select{outline:none;border-color:#12b8ff;background:#fff;color:#0b1330;box-shadow:inset 0 0 0 1.5px #12b8ff,0 0 0 4px rgba(18,184,255,.28),0 0 22px rgba(0,160,255,.7)}
#catpage{display:none}
body.cat #catpage{display:block}
body.cat .layout{display:none}
.cwrap{max-width:760px;margin:0 auto;padding:24px 16px 90px}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.chead h2{margin-right:auto;font-size:22px}
.csub{color:var(--mut);font-size:14px;margin-bottom:16px}
#catform details{background:#fff}
.pk{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px}

.editor{display:block;max-width:760px;margin:0 auto;background:transparent;border:0;padding:20px 16px 0}
.preview{display:none}
body.rev .preview,body.view .preview{display:block}
.wtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac,#1f5eff)}
.prog{display:flex;gap:6px;margin-bottom:14px}
.seg{flex:1;border:0;background:none;padding:4px 0;cursor:pointer;text-align:left;font-family:inherit}
.seg span{display:block;height:5px;border-radius:3px;background:#d9e0f1;transition:background .3s}
.seg.on span{background:var(--ac,#1f5eff)}
.seg em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:5px}
.seg.cur em{color:var(--ac,#1f5eff);font-weight:700}
.wcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 10px 40px rgba(11,19,48,.07)}
.wt{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.ws{color:var(--mut);font-size:14px;margin-bottom:18px;line-height:1.5}
.wcard .f input,.wcard .f textarea,.wcard .f select{font-size:16px;padding:12px 14px;border-radius:12px}
.wcard .f textarea.ag{min-height:46px}
.step{animation:stepin .32s ease backwards}
@keyframes stepin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.wnav{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:14px 0;background:linear-gradient(180deg,rgba(238,241,248,0),var(--bg) 40%)}
.wnav .btn{padding:13px 22px;font-size:15px;border-radius:12px}
.wnav .btn.pri{background:var(--ac,#1f5eff)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sum div{flex:1 1 140px;background:#f3f5fb;border-radius:12px;padding:12px 14px}
.sum small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sum b{font-size:20px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.acts .btn{padding:14px;font-size:14px;border-radius:12px}
@media(max-width:600px){.wcard{padding:18px;border-radius:16px}.wt{font-size:21px}.seg em{display:none}.seg.cur em{display:block}}

.topbar{display:none!important}
:root{--tb:64px}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brandw{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;min-width:0;flex:1}
.brandw img{max-height:34px;max-width:170px;object-fit:contain}
.brandw .mono{width:30px;height:30px;border-radius:9px;background:var(--ac2,#1f5eff);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.hi{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.pk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hi svg,.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-weight:600;font-size:10px;color:var(--mut);cursor:pointer;padding:2px 0}
.tab .ic{width:44px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.tab:active .ic{background:#e8edfa}
.tab.on{color:#1f5eff}.tab.on .ic{background:#e6eeff}
.tab.pri{color:#1f5eff}.tab.pri .ic{background:#1f5eff;color:#fff}
body.login .hdr,body.login .tabs,body.view .hdr,body.view .tabs{display:none}
body:not(.view):not(.login){padding-bottom:calc(var(--tb) + 16px + env(safe-area-inset-bottom))}
.wnav{bottom:calc(var(--tb) + 14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:14px;width:min(620px,calc(100% - 28px));border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(11,19,48,.16)}}

#toast{position:fixed;left:50%;bottom:calc(var(--tb) + 30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0b1330;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:#c0262d}
.logoprev{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logoprev img{max-height:46px;max-width:180px;background:#f3f5fb;border-radius:8px;padding:6px}
.cwrap{padding-top:20px}

#login{background:radial-gradient(circle at 80% 0%,#dfe8ff,transparent 55%),var(--bg)}
#login form{border-radius:22px;padding:32px 28px;max-width:400px;box-shadow:0 20px 60px rgba(11,19,48,.12);border:1px solid var(--line)}
#login h1{font-size:25px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
#login p{margin-bottom:22px}
.lbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:22px}
.lbrand img{max-height:40px;max-width:200px}
.lbrand .mono{width:38px;height:38px;border-radius:11px;background:var(--ac2,#1f5eff);color:#fff;display:grid;place-items:center;font-size:18px}
#login .f input{font-size:16px;padding:13px 14px;border-radius:12px}
#login .f input:focus{outline:none;border-color:#1f5eff;box-shadow:0 0 0 3px rgba(31,94,255,.2)}
.pw{position:relative}.pw input{padding-right:84px!important}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#1f5eff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;padding:8px}
#login .btn{width:100%;padding:14px;font-size:15px;border-radius:12px;background:#1f5eff;margin-top:4px}
#login .btn:disabled{opacity:.6}
#libpage{display:none}
body.lib #libpage{display:block}
body.lib .layout,body.lib #catpage{display:none}
.libq{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;background:#fff;margin-bottom:14px}
.libq:focus{outline:none;border-color:#1f5eff;box-shadow:0 0 0 3px rgba(31,94,255,.2)}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 24px rgba(11,19,48,.05);animation:stepin .3s ease backwards}
.pc b{font-size:17px;display:block;overflow-wrap:anywhere}
.pc .t2{color:var(--mut);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.pc .meta2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chip{background:#f3f5fb;border-radius:99px;padding:5px 11px;font-size:12px;color:var(--mut);font-weight:600}
.chip.hot{background:#e6eeff;color:#1f5eff}
.pca{display:flex;gap:8px;flex-wrap:wrap}
.pca .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px}
.pca .btn:not(.pri){background:#eef1f8;color:var(--ink)}
.pca .btn.ghost{margin-left:auto}
.pca svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:15px}

body.view .cover{min-height:100svh;position:relative}
.hint{display:none}
body.view .hint{display:block;position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:12px;opacity:.7;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
#vprog{display:none}
body.view #vprog{display:block;position:fixed;top:0;left:0;height:3px;width:0;background:#1f5eff;z-index:60;transition:width .1s}
body.view .plan{cursor:pointer;transition:transform .2s,box-shadow .2s}
body.view .plan:hover{transform:translateY(-3px)}
.sel{display:none}
body.view .plan.rec .sel{display:block;color:var(--a);font-weight:700;font-size:13px;margin:-8px 0 10px}
#home{display:none;min-height:calc(100vh - 56px - 110px);place-items:center;padding:20px}
body.home #home{display:grid}
body.home{background:#fff}
body.home .layout,body.home #catpage,body.home #libpage{display:none}
#homebrand{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:.1;filter:grayscale(1);pointer-events:none;user-select:none;font-weight:800;font-size:30px}
#homebrand img{max-width:min(70vw,380px);max-height:38vh;object-fit:contain}
#homebrand .mono{width:120px;height:120px;border-radius:32px;background:#0b1330;color:#fff;display:grid;place-items:center;font-size:60px}
.brandw{cursor:pointer}

.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.chip2{position:relative;text-align:left;border:1.5px solid var(--line);background:#fafbfe;border-radius:14px;padding:12px 44px 12px 14px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.2s}
.chip2 b{display:block;font-size:14px;overflow-wrap:anywhere}
.chip2 small{color:var(--mut);font-size:12px}
.chip2 i{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#e8edfa;color:#1f5eff;display:grid;place-items:center;font-style:normal;font-weight:800}
.chip2.on{border-color:var(--ac,#1f5eff);background:#eef3ff}
.chip2.on i{background:var(--ac,#1f5eff);color:#fff}
.checks{display:grid;gap:6px;margin-bottom:12px}
.ck{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer;font-size:14px}
.ck span{flex:1;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}
.ck small{color:var(--mut);white-space:nowrap}
.disc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:8px}
.cinfo{background:#eef3ff;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.note2{background:#fff8e6;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5600;margin-bottom:14px;line-height:1.5}
.sp{margin-top:10px;font-weight:800;font-size:17px;color:var(--a)}
.sp small{font-weight:500;color:var(--mut);font-size:12px}
.mn{font-size:12px;font-weight:700;color:var(--mut);margin:-6px 0 8px}
.save{background:color-mix(in srgb,var(--a) 10%,#fff);color:var(--a);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:10px;line-height:1.4}
.save small{font-weight:500;color:var(--mut);display:block;font-size:11px}
@media(max-width:900px){.sec,.cover,.cta{padding:32px 22px}}
@media(max-width:600px){
.topbar{padding:8px 10px;gap:6px}.topbar b{width:100%}.btn{padding:8px 10px}.topbar select.btn{flex:1 1 150px;max-width:100%}
.editor{padding:10px;gap:10px}.preview{padding:10px}.two{grid-template-columns:1fr}
.cover{padding:28px 20px;min-height:420px}.sec,.cta{padding:28px 18px}.sec h2,.cta h2{font-size:23px}.doc{border-radius:12px}
.price{font-size:28px}table{font-size:14px}tr.tot td{font-size:18px}.intro{font-size:16px}
body.view .doc{border-radius:0}
body.view .floatbar{width:calc(100% - 20px);justify-content:center}body.view .floatbar .btn{flex:1}
.cwrap{padding:14px 10px 90px}}
@media print{
@page{size:A4;margin:10mm}
body{background:#fff;padding:0!important}
.topbar,.editor,.floatbar,#modal,.hdr,.tabs,#lib,#pick{display:none!important}
.layout{display:block;height:auto}.preview{padding:0;overflow:visible}
.doc{box-shadow:none;border-radius:0;max-width:none}
.cover{min-height:250mm}.cta{break-inside:avoid}
.sec{break-inside:avoid}.plan,.card{break-inside:avoid}
.rv{opacity:1!important;transform:none!important}
.preview:before{display:none}
body.view .cover{min-height:250mm}
#vprog,.hint{display:none!important}
.preview{display:block!important}
}
.row .top label b{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.offer{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#e6eeff;border:1.5px solid #bcd0ff;border-radius:14px;padding:14px;margin-top:16px}
.offer b{font-size:15px}.offer span{font-size:13px;color:var(--mut)}
.row .top .pr{font-size:13px;font-weight:700;white-space:nowrap}
.row details summary{cursor:pointer;color:#1f5eff;font-size:13px;font-weight:600;margin:8px 0}
.st{border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.st-rascunho{background:#f3f5fb;color:var(--mut)}.st-enviada{background:#e6eeff;color:#1f5eff}.st-visualizada{background:#fff4dc;color:#a8650a}.st-aceita{background:#e3f6ea;color:#1a7f45}.st-recusada{background:#fdeaea;color:#b42318}
.lstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.lstat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.lstat small{display:block;color:var(--mut);font-size:12px}.lstat b{font-size:20px}
.lflt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.lflt button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}.lflt button.on{background:#1f5eff;border-color:#1f5eff;color:#fff}
.pc .fu{color:#a8650a;font-size:12px;font-weight:600;margin-top:6px}
.pc select.stsel{font-size:12px;padding:4px 8px;border-radius:99px;margin-left:auto}
.ck{flex-wrap:wrap}.ck span{min-width:150px}
.ck .qt{display:flex;align-items:center;gap:8px;font-style:normal;font-size:13px;color:var(--mut);flex:1 1 100%;margin-left:30px}
.ck .qt input{width:62px;padding:6px 8px;text-align:center;font-size:14px;border-radius:8px}
.ck input[type=checkbox]:not(:checked)~.qt{display:none}
.cinfo{font-size:14px}
</style>
</head>
<body>

<nav class="tabs" id="tabs"></nav>

  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="pickNo">Cancelar</button><button class="btn pri" id="pickOk">Adicionar selecionados</button></div></div></div>

  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
    <button class="btn ghost" id="mClose">Fechar</button>
    <button class="btn" id="mOpen">👁 Ver como cliente</button>
    <button class="btn" id="mCopy">Copiar só o link</button>
    <button class="btn pri" id="mCopyMsg">Copiar mensagem</button>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Math.random().toString(36).slice(2,8);
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const today=()=>new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

function defaults(){return{
  agency:{name:'Dilapre Digital',whatsapp:'',email:'',site:'',logo:'',color:'#1f5eff'},
  client:{name:'',company:''},
  title:'Proposta de Marketing Digital',
  date:today(),validity:7,
  intro:'Olá! Preparei esta proposta pensando nos objetivos do seu negócio. Aqui você encontra como vamos posicionar sua marca, atrair mais clientes e transformar suas redes sociais em uma máquina de contatos.',
  services:[],
  plans:[],
  selected:0,extras:[],discount:0,
  terms:'Pagamento todo dia 10, via Pix ou boleto.\nA verba de anúncios (tráfego pago) é paga à parte, direto na plataforma.',
  steps:'Você aprova a proposta\nAssinamos o contrato digital\nFazemos o onboarding e começamos a produzir',
  ctaTitle:'Vamos começar?',ctaText:'Clique abaixo e fale comigo para fecharmos o seu plano.',ctaBtn:'Aceitar proposta'
}}
let S=defaults();

/* ---------- pack/unpack link ---------- */
async function pack(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));let bytes=raw,pre='r';
  if(window.CompressionStream){const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'));bytes=new Uint8Array(await new Response(cs).arrayBuffer());pre='z'}
  let s='';for(const x of bytes)s+=String.fromCharCode(x);
  return pre+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(c){
  const pre=c[0];c=c.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(c.length%4)c+='=';
  let b=Uint8Array.from(atob(c),x=>x.charCodeAt(0));
  if(pre==='z'){const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'));b=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(b));
}

/* ---------- cálculo ---------- */
const ttl=x=>String(x||'').split('\n')[0];
const svcM=x=>x.type==='unico'?0:(+x.price||0);
function comboInfo(p,services){
  const ss=(p.svc||[]).map(id=>services.find(x=>x.id===id)).filter(Boolean);
  const q=x=>Math.max(1,Math.round(+(p.qty||{})[x.id]||1));
  const avulso=ss.length?ss.reduce((a,x)=>a+(+x.price||0)*q(x),0):(+p.avulso||0);
  const price=+p.price||0,save=Math.max(0,avulso-price);
  return{ss,avulso,price,save,pct:avulso>0?Math.round(save/avulso*100):0,items:[...ss.map(x=>(q(x)>1?q(x)+'× ':'')+ttl(x.title)),...lines(p.items)]};
}
function totals(d){
  const sel=d.plans.length?(d.plans[d._pick??d.selected]||null):null;let m=0,u=0;
  if(sel)m=+sel.price||0;
  else d.services.filter(x=>x.on).forEach(x=>{if(x.type==='unico')u+=+x.price||0;else m+=+x.price||0});
  d.extras.forEach(e=>{if(e.type==='unico')u+=+e.price||0;else m+=+e.price||0});
  const disc=m*(+d.discount||0)/100;
  return{sel,m,u,disc,mt:m-disc,months:sel?(+sel.months||0):0};
}
const waLink=d=>{
  const n=String(d.agency.whatsapp||'').replace(/\D/g,'');const t=totals(d);
  const msg=`Olá! Vi a proposta "${ttl(d.title)}" e quero avançar${t.sel?` com o combo ${ttl(t.sel.name)}`:' com os serviços avulsos'}.`;
  return n?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:'#';
};

/* ---------- render da proposta ---------- */
function renderDoc(d){
  const t=totals(d),a=d.agency,svc=d.services.filter(s=>s.on),selI=d._pick??d.selected,maxM=Math.max(0,...d.plans.map(p=>+p.months||0));
  const who=[d.client.name,d.client.company].filter(Boolean).join(' · ')||'Seu cliente';
  return `
  <section class="cover rv">
    <div class="brand">${a.logo?`<img src="${esc(a.logo)}" alt="">`:''}${!a.logo||a.name?`<span>${esc(a.name)}</span>`:''}</div>
    <div><span class="tag">Proposta comercial</span><h1>${esc(d.title)}</h1><p>Preparada para <b>${esc(who)}</b></p></div>
    <div class="meta"><div><b>Data</b>${esc(d.date)}</div><div><b>Validade</b>${esc(d.validity)} dias</div>${a.site?`<div><b>Site</b>${esc(a.site)}</div>`:''}</div>
    <div class="hint">Role para ver ↓</div>
  </section>
  ${d.intro?`<section class="sec rv"><h2>Sobre esta <em>proposta</em></h2><p class="sub">Entendemos o seu momento</p><p class="intro">${esc(d.intro)}</p></section>`:''}
  ${svc.length?`<section class="sec rv"><h2>O que vamos <em>entregar</em></h2><p class="sub">${d.plans.length?'Serviços incluídos na parceria':'Valor avulso de cada serviço'}</p>
    <div class="grid g3">${svc.map((s,i)=>`<div class="card"><div class="n">${i+1}</div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>${+s.price>0?`<div class="sp">${brl(s.price)}<small>${s.type==='unico'?' pagamento único':' /mês avulso'}</small></div>`:''}</div>`).join('')}</div></section>`:''}
  ${d.plans.length?`<section class="sec rv"><h2>Escolha o seu <em>combo</em></h2><p class="sub">${maxM?`Combos com contrato de permanência mínima de ${maxM} meses`:'Combos pensados para cada fase do negócio'}</p>
    <div class="grid g3" style="padding-top:12px">${d.plans.map((p,i)=>{const ci=comboInfo(p,svc);return `<div class="plan ${i===selI?'rec':''}" data-pick="${i}">${i===d.selected?'<span class="badge">Recomendado</span>':''}
      <h3>${esc(p.name)}</h3><div class="price">${brl(p.price)}<small> /mês</small></div>
      ${+p.months>0?`<div class="mn">Contrato mínimo de ${+p.months} meses</div>`:''}
      ${ci.save>0?`<div class="save">Economia de ${brl(ci.save)}/mês <small>(${ci.pct}% vs. ${brl(ci.avulso)} avulso)</small></div>`:''}
      <div class="sel">✓ Selecionado</div><ul>${ci.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}).join('')}</div></section>`:''}
  ${(t.sel||svc.some(x=>+x.price>0)||d.extras.length)?`<section class="sec rv"><h2>Seu <em>investimento</em></h2><p class="sub">${t.sel?'Resumo do combo selecionado':'Resumo dos serviços avulsos'}</p>
    <table>
      ${t.sel?`<tr><td>Combo ${esc(t.sel.name)}</td><td>${brl(t.sel.price)}/mês</td></tr>`:svc.filter(x=>+x.price>0).map(x=>`<tr><td>${esc(x.title)}${x.type==='unico'?' <small style="color:var(--mut)">(pagamento único)</small>':''}</td><td>${brl(x.price)}${x.type==='unico'?'':'/mês'}</td></tr>`).join('')}
      ${d.extras.map(e=>`<tr><td>${esc(e.label)}${e.type==='unico'?' <small style="color:var(--mut)">(pagamento único)</small>':''}</td><td>${brl(e.price)}${e.type==='unico'?'':'/mês'}</td></tr>`).join('')}
      ${t.disc>0?`<tr><td>Desconto (${+d.discount}%)</td><td>− ${brl(t.disc)}</td></tr>`:''}
      <tr class="tot"><td>Total mensal</td><td>${brl(t.mt)}</td></tr>
      ${t.u>0?`<tr><td>Total pagamento único</td><td>${brl(t.u)}</td></tr>`:''}
    </table>
    ${t.sel&&t.months?`<div class="note">Combo com contrato de permanência mínima de ${t.months} meses. Valor total do contrato: <b>${brl(t.mt*t.months+t.u)}</b>.</div>`:(t.sel?'':'<div class="note">Serviços contratados avulsamente.</div>')}</section>`:''}
  ${lines(d.terms).length||lines(d.steps).length||t.months?`<section class="sec rv"><div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:36px">
    ${lines(d.steps).length?`<div><h2>Próximos <em>passos</em></h2><ol class="steps">${lines(d.steps).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}
    ${lines(d.terms).length||t.months?`<div><h2>Condições</h2><ul class="terms">${lines(d.terms).map(x=>`<li>${esc(x)}</li>`).join('')}${t.months?`<li>Combo com contrato de permanência mínima de ${t.months} meses.</li>`:''}<li>Esta proposta é válida por ${esc(d.validity)} dias.</li></ul></div>`:''}
  </div></section>`:''}
  <section class="cta rv"><h2>${esc(d.ctaTitle)}</h2><p>${esc(d.ctaText)}</p>
    <a class="big" href="${waLink(d)}" target="_blank" rel="noopener">${esc(d.ctaBtn)}</a>
    <div class="ct">${esc(a.name)}${a.whatsapp?`<br>WhatsApp: ${esc(a.whatsapp)}`:''}${a.email?`<br>${esc(a.email)}`:''}${a.site?`<br>${esc(a.site)}`:''}</div></section>`;
}
let io;
function paint(){
  const doc=$('#doc');doc.style.setProperty('--a',S.agency.color||'#1f5eff');
  const seen=new Set([...doc.querySelectorAll('.rv')].map((e,i)=>e.classList.contains('in')?i:-1));
  doc.innerHTML=renderDoc(S);updSum();renderBrand();
  const els=doc.querySelectorAll('.rv');
  if(document.body.classList.contains('view')){
    io&&io.disconnect();
    io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
    els.forEach((e,i)=>{if(seen.has(i))e.classList.add('in');else io.observe(e)});
    const t=totals(S);$('#vOk').textContent=t.sel?'✅ Aceitar combo '+ttl(t.sel.name):'✅ Aceitar proposta';
  }else els.forEach(e=>e.classList.add('in'));
}

/* ---------- formulário ---------- */
const SINGLE=['agency.whatsapp','agency.email','agency.site','date','ctaBtn'];
const F=(l,p,v,t='text')=>(t==='text'&&!SINGLE.includes(p))?`<label class="f"><span>${l}</span><textarea class="ag" rows="1" data-p="${p}">${esc(v)}</textarea></label>`:`<label class="f"><span>${l}</span><input type="${t}" data-p="${p}" value="${esc(v)}"></label>`;
const T=(l,p,v,r=3)=>`<label class="f"><span>${l}</span><textarea class="ag" rows="${r}" data-p="${p}">${esc(v)}</textarea></label>`;
const STEPS=['Cliente','O que vender','Investimento','Condições','Revisar'];
var STEP=1,LAST=1,DIRTY=false;
const META={
 0:['Sua marca','Seus dados aparecem em todas as propostas.'],
 1:['Para quem é a proposta?','Dados do cliente e a mensagem de abertura.'],
 2:['O que vender','Marque os serviços. Com 2 ou mais, você pode oferecer um combo com preço melhor e contrato mínimo.'],
 3:['Quanto fica o investimento?','Confira o total, adicione extras e desconto.'],
 4:['Condições e fechamento','Regras de pagamento, próximos passos e o convite final.'],
 5:['Revise e envie','Confira como o cliente vai ver. Depois salve e gere o link.']};
function goStep(k){
  if(k==='next')STEP=Math.min(5,STEP+1);else if(k==='prev')STEP=Math.max(1,STEP-1);
  else if(k==='brand'){openCat(1);return}else if(k==='back')STEP=LAST||1;else STEP=+k;
  buildForm();window.scrollTo({top:0,behavior:'smooth'});
  if(STEP===5)autoSave();
}
let saving=false;
async function autoSave(){
  if(saving||(!DIRTY&&curRow))return;saving=true;
  try{const r=await saveCurrent();if(r)toast('Proposta salva automaticamente ✓')}finally{saving=false}
}
function updSum(){
  const t=totals(S),el=$('#sumbox'),fu=t.u>0?`<div><small>Pagamento único</small><b>${brl(t.u)}</b></div>`:'';
  if(el)el.innerHTML=t.sel?`<div><small>Combo</small><b>${esc(ttl(t.sel.name))}</b></div><div><small>Total mensal</small><b>${brl(t.mt)}</b></div>${t.months?`<div><small>Contrato mínimo</small><b>${t.months} meses</b></div>`:''}${fu}`:`<div><small>Modalidade</small><b>Serviços avulsos</b></div><div><small>Total mensal</small><b>${brl(t.mt)}</b></div>${fu}`;
  const e2=$('#sub2');
  if(e2){let m=0,u=0;S.services.filter(x=>x.on).forEach(x=>{if(x.type==='unico')u+=+x.price||0;else m+=+x.price||0});e2.innerHTML=`<div><small>Soma avulsa mensal</small><b>${brl(m)}</b></div>${u>0?`<div><small>Pagamento único</small><b>${brl(u)}</b></div>`:''}`}
  refreshCombos(S);
}
const cinfoHTML=ci=>ci.avulso>0?`Total dos serviços selecionados <b>${brl(ci.avulso)}</b> · combo <b>${brl(ci.price)}/mês</b>${ci.save>0?` · economia <b>${brl(ci.save)}/mês (${ci.pct}%)</b>`:''}`:'Marque os serviços para somar o total.';
function refreshCombos(obj){
  const svs=obj===S?S.services.filter(x=>x.on):obj.services;
  obj.plans.forEach((p,i)=>{const el=$('#cinfo-'+i);if(el)el.innerHTML=cinfoHTML(comboInfo(p,svs))});
}
const serviceRow=(x,i,inc)=>`<div class="row"><div class="top">${inc?`<label><input type="checkbox" data-p="services.${i}.on" ${x.on?'checked':''}> Incluir</label>`:`<span>Serviço ${i+1}</span>`}<button class="btn sm ghost" data-act="del:services:${i}">Remover</button></div>
  ${F('Nome do serviço',`services.${i}.title`,x.title)}${T('O que é / o que está incluso',`services.${i}.desc`,x.desc,3)}

const svsOf=obj=>obj===S?S.services.filter(x=>x.on):obj.services;
function lockPct(obj,pi){
  const p=obj.plans[+pi];if(!p||p.pct!=null)return;
  const ci=comboInfo(p,svsOf(obj));
  p.pct=ci.avulso>0&&p.price>0&&p.price<=ci.avulso?(1-p.price/ci.avulso)*100:0;
}
function recalc(obj,pi){
  const p=obj.plans[+pi];if(!p)return;lockPct(obj,pi);applyDisc(obj,pi,p.pct);
  const inp=document.querySelector((obj===S?'#form':'#catform')+' [data-p="plans.'+pi+'.price"]');if(inp)inp.value=p.price;
}
function recalcAuto(obj){obj.plans.forEach((p,i)=>{if(p.pct!=null)recalc(obj,i)})}
function priceEdited(obj,pi){
  const p=obj.plans[+pi],ci=comboInfo(p,svsOf(obj));
  p.pct=ci.avulso>0?(1-(+p.price||0)/ci.avulso)*100:0;
}
function dropSvc(obj,id){obj.plans.forEach((p,i)=>{if((p.svc||[]).includes(id)){lockPct(obj,i);p.svc=p.svc.filter(z=>z!==id);recalc(obj,i)}})}
function toggleSvcIn(obj,el){
  const [pi,sid]=el.dataset.svc.split(':');lockPct(obj,pi);const pl=obj.plans[+pi];pl.svc=pl.svc||[];const k=pl.svc.indexOf(sid);
  if(el.checked&&k<0)pl.svc.push(sid);if(!el.checked&&k>=0)pl.svc.splice(k,1);
  recalc(obj,pi);
}
function setQty(obj,el){
  const [pi,sid]=el.dataset.qty.split(':');lockPct(obj,pi);const pl=obj.plans[+pi];pl.qty=pl.qty||{};
  pl.qty[sid]=Math.max(1,Math.round(+el.value)||1);recalc(obj,pi);
}
function applyDisc(obj,idx,pct){
  const svs=obj===S?S.services.filter(x=>x.on):obj.services,p=obj.plans[+idx],ci=comboInfo(p,svs);
  p.pct=+pct;if(ci.avulso>0)p.price=Math.round(ci.avulso*(1-(+pct)/100));
}

  const b=e.target.closest('[data-act]');if(!b)return;const [act,k,i]=b.dataset.act.split(':');

      S.plans.push({id:uid(),cid:c.id,name:c.name,price:c.price,months:c.months||3,svc:ids,qty,pct:c.pct??null,items:c.items||''});

function onLogo(e){

    if(!data){$('#doc').innerHTML='<section class="sec"><h2>Proposta não encontrada</h2><p class="sub">Este link pode ter expirado ou sido removido. Fale com quem enviou.</p></section>';return}
    S=Object.assign(defaults(),data);
    document.title=S.title+' — '+(S.client.company||S.client.name||S.agency.name);paint();return;
  }
  if(!sb){document.body.classList.add('login');$('#loginMsg').textContent=configured?'Não foi possível carregar o Supabase.':'Falta configurar o Supabase (veja o guia).';return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.body.classList.add('login');return}
  startApp();
}

const catDefault=()=>Object.assign(sampleCat(),{brand:Object.assign({},S.agency)});
async function loadCat(){
  if(CAT)return CAT;
  const {data}=await sb.from('catalog').select('data').maybeSingle();
  CAT=Object.assign(catDefault(),(data&&data.data)||{});
  CAT.services=CAT.services.map(x=>Object.assign({price:0,type:'mensal'},x));CAT.plans=CAT.plans.map(x=>Object.assign({months:3,svc:[],items:''},x));CAT.extras=CAT.extras||[];
  CAT.brand=Object.assign({},S.agency,CAT.brand||{});return CAT;

const CSTEPS=['Marca','Serviços','Combos','Extras'];var CSTEP=1;
const CMETA={1:['Sua marca','Aparece no topo e em todas as propostas.'],2:['Seus serviços','O que você presta, o que está incluso e o valor avulso de cada um.'],3:['Seus combos','Junte serviços, defina o preço do combo e o contrato mínimo. Quanto mais serviços, maior a economia.'],4:['Extras','Itens avulsos: setup, filmagem extra, gestão de verba e o que mais você cobrar.']};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)}
function catBody(c){
  const b=c.brand;
  if(CSTEP===1)return `${F('Nome da agência','brand.name',b.name)}${F('WhatsApp (com DDD, só números)','brand.whatsapp',b.whatsapp)}
    <div class="two">${F('E-mail','brand.email',b.email)}${F('Site / Instagram','brand.site',b.site)}</div>
    ${F('Cor principal','brand.color',b.color,'color')}
    ${b.logo?`<div class="logoprev"><img src="${esc(b.logo)}" alt="Logo"><button class="btn sm ghost" data-act="rmlogo">Remover logo</button></div>`:''}
    <label class="f"><span>${b.logo?'Trocar logo':'Logo (opcional)'}</span><input type="file" id="clogo" accept="image/*"></label>`;
  if(CSTEP===2)return `${c.services.map((x,i)=>serviceRow(x,i,false)).join('')}<button class="btn sm" data-act="add:services">+ Serviço</button>`;
  if(CSTEP===3)return `${c.plans.map((p,i)=>comboRow(p,i,c.services,false,false)).join('')}<button class="btn sm" data-act="add:plans">+ Combo</button>`;
  return `${c.extras.map((x,i)=>`<div class="row"><div class="top"><span>Extra ${i+1}</span><button class="btn sm ghost" data-act="del:extras:${i}">Remover</button></div>
      ${F('Descrição',`extras.${i}.label`,x.label)}
      <div class="two">${F('Valor (R$)',`extras.${i}.price`,x.price,'number')}
      <label class="f"><span>Cobrança</span><select data-p="extras.${i}.type"><option value="mensal" ${x.type!=='unico'?'selected':''}>Mensal</option><option value="unico" ${x.type==='unico'?'selected':''}>Pagamento único</option></select></label></div></div>`).join('')}
    <button class="btn sm" data-act="add:extras">+ Extra</button>`;
}
function buildCat(){
  CAT.plans.forEach((p,i)=>{lockPct(CAT,i);applyDisc(CAT,i,p.pct)});
  const c=CAT,m=CMETA[CSTEP];$('#catform').style.setProperty('--ac',c.brand.color||'#1f5eff');
  $('#catform').innerHTML=`<div class="wtop"><span class="wk">Meu catálogo · etapa ${CSTEP} de 4</span></div>
    <div class="prog">${CSTEPS.map((n,i)=>`<button class="seg ${i+1<=CSTEP?'on':''} ${i+1===CSTEP?'cur':''}" data-act="cgo:${i+1}"><span></span><em>${n}</em></button>`).join('')}</div>
    <div class="wcard step"><h2 class="wt">${m[0]}</h2><p class="ws">${m[1]}</p>${catBody(c)}</div>
    <div class="wnav">${CSTEP>1?'<button class="btn ghost" data-act="cgo:prev">← Voltar</button>':'<span></span>'}${CSTEP<4?'<button class="btn pri" data-act="cgo:next">Continuar →</button>':'<button class="btn pri" data-act="cgo:save">Salvar catálogo ✓</button>'}</div>`;
  $('#clogo')?.addEventListener('change',onCatLogo);growAll();
}
async function goCat(k){
  if(k==='save'){const ok=await saveCat();if(ok)$('#cBack').click();return}
  await saveCat(true);
  if(k==='next')CSTEP=Math.min(4,CSTEP+1);else if(k==='prev')CSTEP=Math.max(1,CSTEP-1);else CSTEP=+k;
  buildCat();window.scrollTo({top:0,behavior:'smooth'});
}
async function saveCat(quiet){
  const {data:{user}}=await sb.auth.getUser();
  const {error}=await sb.from('catalog').upsert({owner:user.id,data:CAT,updated_at:new Date().toISOString()});
  if(error){toast('Não consegui salvar o catálogo. Rode o catalogo.sql no Supabase.',true);return false}
  S.agency=Object.assign({},S.agency,CAT.brand);paint();draft();cacheBrand();
  if(!quiet)toast('Catálogo salvo ✓');return true;
}
function onCatLogo(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const h=Math.min(120,im.height),w=im.width*h/im.height;const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(im,0,0,w,h);CAT.brand.logo=cv.toDataURL('image/png');buildCat()};im.src=r.result};
  r.readAsDataURL(f);
}
$('#catform').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.svc){toggleSvcIn(CAT,el);refreshCombos(CAT);return}
  if(el.dataset.qty){setQty(CAT,el);refreshCombos(CAT);return}
  const p=el.dataset.p;if(!p)return;
  let v=el.value;if(el.type==='number')v=v===''?0:+v;
  if(el.tagName==='TEXTAREA')grow(el);setPath(CAT,p,v);if(/^services\./.test(p))recalcAuto(CAT);{const m=p.match(/^plans\.(\d+)\.price$/);if(m)priceEdited(CAT,+m[1])}refreshCombos(CAT);
});
$('#catform').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const [act,k,i]=b.dataset.act.split(':');
  if(act==='cgo'){goCat(k);return}
  if(act==='rmlogo')CAT.brand.logo='';
  if(act==='disc')applyDisc(CAT,k,i);
  if(act==='add'){
    if(k==='services')CAT.services.push({id:uid(),title:'Novo serviço',desc:'',price:0,type:'mensal'});
    if(k==='plans')CAT.plans.push({id:uid(),name:'Novo combo',price:0,months:3,svc:[],qty:{},pct:0,items:''});
    if(k==='extras')CAT.extras.push({id:uid(),label:'Novo extra',price:0,type:'mensal'});
  }
  if(act==='del'){
    const id=k==='services'?(CAT.services[+i]||{}).id:null;if(id)dropSvc(CAT,id);CAT[k].splice(+i,1);
  }
  buildCat();
});
async function openCat(n){if(n)CSTEP=n;await loadCat();buildCat();document.body.classList.remove('lib','home');document.body.classList.add('cat');window.scrollTo(0,0)}

const cacheBrand=()=>{try{const b=CAT.brand;localStorage.setItem('dp_brand',JSON.stringify({name:b.name,logo:b.logo,color:b.color}))}catch(e){}};
async function openProposal(id){
  const {data,error}=await sb.from('proposals').select('id,public_id,data').eq('id',id).single();
  if(error){toast(error.message,true);return}

  curRow={id:data.id,public_id:data.public_id};DIRTY=false;STEP=1;leaveCat();buildForm();paint();refreshSaved();window.scrollTo(0,0);

let LIB=[];
async function openLibPage(){
  document.body.classList.remove('cat','home');document.body.classList.add('lib');
  $('#libgrid').innerHTML='<p class="empty">Carregando…</p>';
  const {data}=await sb.from('proposals').select('id,public_id,client,title,views,last_viewed_at,updated_at,status,data').order('updated_at',{ascending:false});
  LIB=data||[];drawLib();window.scrollTo(0,0);
}
var LF='todas';
const STN={rascunho:'Rascunho',enviada:'Enviada',visualizada:'Visualizada',aceita:'Aceita',recusada:'Recusada'};
const stOf=r=>{const s=r.status||'rascunho';return s==='enviada'&&r.views>0?'visualizada':s};
const valOf=r=>{try{return totals(Object.assign(defaults(),r.data||{})).mt||0}catch(e){return 0}};
function drawLib(){
  const q=($('#libq').value||'').toLowerCase(),fd=d=>d?new Date(d).toLocaleDateString('pt-BR'):'';
  const grp={todas:()=>true,rascunho:s=>s==='rascunho',enviadas:s=>s==='enviada'||s==='visualizada',aceitas:s=>s==='aceita'};
  const L=LIB.filter(r=>((r.client||'')+' '+(r.title||'')).toLowerCase().includes(q)&&grp[LF](stOf(r)));
  const open=LIB.filter(r=>['enviada','visualizada'].includes(stOf(r)));
  $('#lstat').innerHTML=`<div><small>Em aberto</small><b>${brl(open.reduce((a,r)=>a+valOf(r),0))}</b><small>${open.length} ${open.length===1?'proposta':'propostas'} /mês</small></div><div><small>Aceitas</small><b>${LIB.filter(r=>stOf(r)==='aceita').length}</b><small>de ${LIB.length} no total</small></div>`;
  $('#lflt').innerHTML=[['todas','Todas'],['rascunho','Rascunhos'],['enviadas','Enviadas'],['aceitas','Aceitas']].map(([k,n])=>`<button class="${LF===k?'on':''}" data-lf="${k}">${n}</button>`).join('');
  $('#libsub').textContent=LIB.length?'Toque em Abrir para editar ou mude o status de cada proposta.':'Você ainda não salvou nenhuma proposta.';
  $('#libgrid').innerHTML=L.length?L.map(r=>{const st=stOf(r),dias=r.last_viewed_at?Math.floor((Date.now()-new Date(r.last_viewed_at))/864e5):0;
    return `<div class="pc"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${esc(r.client||'Sem cliente')}</b><span class="st st-${st}">${STN[st]}</span></div><div class="t2">${esc((r.title||'').split('\n')[0])}</div>
    ${st==='visualizada'&&dias>=3?`<div class="fu">Visualizada há ${dias} dias, sem resposta. Que tal chamar o cliente?</div>`:''}
    <div class="meta2"><span class="chip">${brl(valOf(r))}/mês</span><span class="chip ${r.views?'hot':''}">${r.views||0} ${r.views===1?'visualização':'visualizações'}</span><span class="chip">${fd(r.updated_at)}</span></div>
    <div class="pca"><button class="btn pri" data-lo="${r.id}">Abrir</button><button class="btn" data-lc="${r.public_id}">${ico('link')}Copiar link</button><button class="btn" data-ld="${r.id}">${ico('copy')}Duplicar</button><select class="stsel" data-ls="${r.id}" aria-label="Status">${Object.keys(STN).map(k=>`<option value="${k}" ${(r.status||'rascunho')===k?'selected':''}>${STN[k]}</option>`).join('')}</select><button class="btn ghost" data-lx="${r.id}" aria-label="Excluir">${ico('trash')}</button></div></div>`}).join(''):`<p class="empty">${LIB.length?'Nenhuma proposta encontrada.':'Crie sua primeira proposta pela aba Nova.'}</p>`;
}
$('#lflt').addEventListener('click',e=>{const b=e.target.closest('[data-lf]');if(b){LF=b.dataset.lf;drawLib()}});
$('#libgrid').addEventListener('change',async e=>{const el=e.target.closest('[data-ls]');if(!el)return;
  const {error}=await sb.from('proposals').update({status:el.value}).eq('id',el.dataset.ls);
  if(error)return toast(error.message,true);const r=LIB.find(x=>x.id===el.dataset.ls);if(r)r.status=el.value;drawLib();toast('Status atualizado ✓')});
$('#libq').addEventListener('input',drawLib);
$('#libgrid').addEventListener('click',async e=>{
  const o=e.target.closest('[data-lo]'),c=e.target.closest('[data-lc]'),d=e.target.closest('[data-ld]'),x=e.target.closest('[data-lx]');
  if(o)return openProposal(o.dataset.lo);
  if(c){const u=baseUrl()+'?v='+c.dataset.lc;try{await navigator.clipboard.writeText(u)}catch(er){prompt('Copie o link:',u)}return toast('Link copiado ✓')}
  if(d){
    const {data:r,error}=await sb.from('proposals').select('data,client').eq('id',d.dataset.ld).single();
    if(error)return toast(error.message,true);
    const nd=JSON.parse(JSON.stringify(r.data));nd.title=(nd.title||'Proposta')+' (cópia)';
    const ins=await sb.from('proposals').insert({title:nd.title,client:r.client||'',data:nd});
    if(ins&&ins.error)return toast(ins.error.message,true);
    toast('Proposta duplicada ✓');await openLibPage();refreshSaved();return;
  }
  if(x&&confirm('Excluir esta proposta? O link dela deixará de funcionar.')){
    await sb.from('proposals').delete().eq('id',x.dataset.lx);if(curRow&&curRow.id===x.dataset.lx)curRow=null;
    toast('Proposta excluída');await openLibPage();refreshSaved();

});

init();
